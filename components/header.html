<style>
    #site-header {
        position: fixed !important;
        top: 0 !important;
        width: 100% !important;
        transform: none !important;
    }

    /* Wordmark - the Green Seasons display serif, letterspaced */
    .wordmark {
        font-family: var(--font-heading);
        font-weight: 700;
        letter-spacing: 0.18em;
        line-height: 1;
        white-space: nowrap;
        text-transform: uppercase;
    }
    .wordmark .amp {
        font-style: italic;
        letter-spacing: 0.06em;
        padding: 0 0.12em;
    }

    /* Brand logo. Two files: white artwork over the hero, ink artwork
       once the header goes solid and inside the white drawer. */
    .brand-logo {
        display: block;
        width: auto;
        height: 72px;
    }
    @media (min-width: 640px) { .brand-logo { height: 84px; } }
    @media (min-width: 1024px) { .brand-logo { height: 96px; } }
    #site-header.on-image .brand-logo--dark { display: none; }
    #site-header.solid .brand-logo--light { display: none; }

    /* Nav: sits either side of the centred wordmark */
    .hdr-link {
        position: relative;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
        white-space: nowrap;
        padding-bottom: 3px;
        transition: color 0.25s ease;
    }
    .hdr-link::after {
        content: '';
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 2px;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.25s ease-in-out;
    }
    .hdr-link.is-active::after { transform: scaleX(1); }
    @media (hover: hover) { .hdr-link:hover::after { transform: scaleX(1); } }

    /* Over the hero image the header is transparent with light type;
       once scrolled it becomes solid white with ink type. */
    #site-header.on-image .hdr-link,
    #site-header.on-image .wordmark,
    #site-header.on-image #menuBtn { color: #FFFFFF; }
    #site-header.on-image { background: transparent; border-color: transparent; }
    #site-header.on-image .hdr-link:hover { color: #FFFFFF; }

    #site-header.solid {
        background: var(--bg);
        border-bottom: 1px solid var(--border);
    }
    #site-header.solid .hdr-link,
    #site-header.solid .wordmark,
    #site-header.solid #menuBtn { color: var(--text); }
</style>

        <!-- LEFT: three links -->
        <nav class="hidden lg:flex items-center gap-8 justify-self-start">

            <div class="relative group/about">

                    </div>

        </nav>

        <!-- mobile: burger sits left so the wordmark stays centred -->

            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            </svg>

        <!-- CENTRE: wordmark -->

        <!-- RIGHT: desktop only. On mobile these live in the drawer. -->

        <nav class="flex flex-col items-center text-center gap-6 font-body text-lg text-ink py-10 px-6">

            <a href="tel:+15754965247" class="btn-line btn-line--dark w-full max-w-xs">Call Us</a>
        </nav>
    </div>

</header>
